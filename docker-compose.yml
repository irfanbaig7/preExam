# Optional: run everything with Docker instead of installing Node and MongoDB locally.
#   docker compose up --build
services:
  mongo:
    image: mongo:7
    volumes: [mongo-data:/data/db]
    ports: ["27017:27017"]
  server:
    build: ./server
    env_file: ./server/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/pyq_analyzer
    volumes: [uploads:/app/uploads]
    ports: ["5000:5000"]
    depends_on: [mongo]
  client:
    build:
      context: ./client
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000/api
    ports: ["3000:3000"]
    depends_on: [server]
volumes:
  mongo-data:
  uploads:
